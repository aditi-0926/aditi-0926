name: 🌌 Update GitHub Galaxy

on:

  # Update every day
  schedule:
    - cron: "0 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Run whenever repository structure changes
  push:
    paths:
      - "scripts/generate_repositories.py"
      - ".github/workflows/update-galaxy.yml"


permissions:
  contents: write


jobs:

  update-galaxy:

    name: ✦ Synchronize Galaxy

    runs-on: ubuntu-latest


    steps:

      # ---------------------------------------------
      # Checkout repository
      # ---------------------------------------------

      - name: 🚀 Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------
      # Setup Python
      # ---------------------------------------------

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # ---------------------------------------------
      # Generate repository section
      # ---------------------------------------------

      - name: 🌌 Generate repository galaxy
        run: |

          python scripts/generate_repositories.py


      # ---------------------------------------------
      # Commit generated README
      # ---------------------------------------------

      - name: ✨ Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          git diff --cached --quiet || \
            git commit -m "🌌 Update GitHub galaxy"

          git push
