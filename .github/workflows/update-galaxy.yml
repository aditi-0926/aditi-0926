name: 🌌 Update Repository Galaxy

on:

  # Update automatically every day
  schedule:

    - cron: "0 6 * * *"


  # Allow manual execution
  workflow_dispatch:


  # Run when the generator changes
  push:

    paths:

      - "scripts/generate_repositories.py"


permissions:

  contents: write


jobs:

  update-galaxy:

    runs-on: ubuntu-latest


    steps:

      # -------------------------------------------------
      # Checkout repository
      # -------------------------------------------------

      - name: 🌙 Enter the universe

        uses: actions/checkout@v4


      # -------------------------------------------------
      # Setup Python
      # -------------------------------------------------

      - name: 🐍 Prepare Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"


      # -------------------------------------------------
      # Install requests
      # -------------------------------------------------

      - name: 📡 Connect to GitHub

        run: |

          pip install requests


      # -------------------------------------------------
      # Generate repository constellation
      # -------------------------------------------------

      - name: 🪐 Generate repository planets

        run: |

          python scripts/generate_repositories.py


      # -------------------------------------------------
      # Commit changes
      # -------------------------------------------------

      - name: ✨ Update the galaxy

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then

            echo "🌙 No changes detected."

          else

            git commit -m "🌌 Update repository constellation"

            git push

          fi
