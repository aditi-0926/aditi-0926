
<svg
xmlns="http://www.w3.org/2000/svg"
width="1100"
height="250"
viewBox="0 0 1100 250"
>

<defs>

    <!-- colourful glass gradient -->

    <linearGradient
        id="glass"
        x1="0"
        y1="0"
        x2="1"
        y2="1"
    >

        <stop
            offset="0%"
            stop-color="#4F8CFF"
            stop-opacity="0.27"
        />

        <stop
            offset="45%"
            stop-color="#FFFFFF"
            stop-opacity="0.09"
        />

        <stop
            offset="100%"
            stop-color="#C084FC"
            stop-opacity="0.20"
        />

    </linearGradient>


    <!-- glow -->

    <filter
        id="glow"
        x="-50%"
        y="-50%"
        width="200%"
        height="200%"
    >

        <feGaussianBlur
            stdDeviation="12"
            result="blur"
        />

        <feMerge>

            <feMergeNode in="blur"/>

            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>


    <!-- moving light -->

    <linearGradient
        id="shine"
        x1="0"
        y1="0"
        x2="1"
        y2="0"
    >

        <stop
            offset="0%"
            stop-color="#FFFFFF"
            stop-opacity="0"
        />

        <stop
            offset="50%"
            stop-color="#FFFFFF"
            stop-opacity="0.28"
        />

        <stop
            offset="100%"
            stop-color="#FFFFFF"
            stop-opacity="0"
        />

        <animate
            attributeName="x1"
            values="-1;1"
            dur="5s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="x2"
            values="0;2"
            dur="5s"
            repeatCount="indefinite"
        />

    </linearGradient>


    

    <defs>

        <radialGradient id="planet1">

            <stop
                offset="0%"
                stop-color="#FFFFFF"
                stop-opacity="0.95"
            />

            <stop
                offset="20%"
                stop-color="#60A5FA"
            />

            <stop
                offset="100%"
                stop-color="#C084FC"
            />

        </radialGradient>

        <filter
            id="planetGlow1"
            x="-100%"
            y="-100%"
            width="300%"
            height="300%"
        >

            <feGaussianBlur
                stdDeviation="10"
                result="blur"
            />

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>


    <!-- planet glow -->

    <circle
        cx="125"
        cy="125"
        r="73"
        fill="#C084FC"
        opacity="0.20"
        filter="url(#planetGlow1)"
    />


    <!-- orbit ring -->

    <ellipse
        cx="125"
        cy="125"
        rx="90"
        ry="28"
        fill="none"
        stroke="#DDD6FE"
        stroke-width="3"
        opacity="0.65"
        transform="rotate(-18 125 125)"
    />


    <!-- planet -->

    <circle
        cx="125"
        cy="125"
        r="58"
        fill="url(#planet1)"
    />


    <!-- planet shine -->

    <ellipse
        cx="107"
        cy="106"
        rx="22"
        ry="14"
        fill="#FFFFFF"
        opacity="0.15"
        transform="rotate(-30 107 106)"
    />


    <!-- little moon -->

    <circle
        cx="192"
        cy="95"
        r="7"
        fill="#FFFFFF"
        opacity="0.75"
    />

    

</defs>


<!-- soft purple glow behind card -->

<rect
    x="15"
    y="15"
    width="1070"
    height="220"
    rx="30"
    fill="#8B7CFF"
    opacity="0.12"
